apiVersion: apps/v1
kind: Deployment
metadata:
  name: aws-core-payment
  namespace: payment
  labels:
    app: aws-core-payment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aws-core-payment
  template:
    metadata:
      labels:
        app: aws-core-payment
    spec:
      containers:
        - name: aws-core-payment
          image: 123456789012.dkr.ecr.us-west-2.amazonaws.com/aws-core-payment:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: aws-core-payment-config
          env:
            - name: SECURITY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: aws-core-payment-secret
                  key: api-key
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: aws-core-payment
  namespace: payment
spec:
  type: ClusterIP
  selector:
    app: aws-core-payment
  ports:
    - name: http
      port: 80
      targetPort: 8080
