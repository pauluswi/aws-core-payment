spring:
  application:
    name: aws-core-payment

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

# Security: set X-API-KEY here for API protection. Leave empty to disable for local/test.
security:
  api-key: ""

logging:
  level:
    root: INFO

# Additional observability settings could be placed here (trace, metrics, exporters)
